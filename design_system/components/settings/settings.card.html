<!DOCTYPE html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../../styles.css">
<style>body{padding:18px 24px;background:var(--sf-gradient-page)}.grid{display:grid;grid-template-columns:1fr 260px;gap:24px;align-items:start}.stack{display:flex;flex-direction:column;gap:14px}</style>
</head><body><div id="root"></div>
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<script src="../../_ds_bundle.js"></script>
<script type="text/babel">
const NS = window.StreamFolioDesignSystem_2b0fe2;
const { SettingsCard, CardDivider, SettingsRow, SectionLabel, StreamFolioSwitch, SelectorField, InfoNote } = NS;
ReactDOM.createRoot(document.getElementById('root')).render(
  <div className="grid">
    <div>
      <SectionLabel>Data Management</SectionLabel>
      <div style={{height:10}} />
      <SettingsCard>
        <SettingsRow icon="list" iconBg="var(--sf-tertiary)" title="Manage Content & Sources" subtitle="Customise topics and curation channels" onClick={()=>{}} />
        <CardDivider />
        <SettingsRow icon="rss_feed" iconBg="var(--sf-primary)" title="Custom RSS Feeds" subtitle="Add and manage private RSS publishers" onClick={()=>{}} />
        <CardDivider />
        <SettingsRow icon="hearing" iconBg="var(--sf-secondary)" title="Auto-play next article" subtitle="Continue the audio queue without tapping" trailing={<StreamFolioSwitch checked />} />
        <CardDivider />
        <SettingsRow icon="backup" iconBg="var(--sf-secondary)" title="Backup & Restore" subtitle="Import/export feeds and settings backup" trailing={<StreamFolioSwitch />} />
      </SettingsCard>
    </div>
    <div className="stack">
      <SelectorField label="Region" value="United Kingdom" icon="public" />
      <SelectorField value="English" icon="translate" />
      <InfoNote>Translation runs on-device. Nothing you read is sent to a server.</InfoNote>
    </div>
  </div>
