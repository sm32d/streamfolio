<!-- @dsCard group="Shape" viewport="700x200" name="Card anatomy" subtitle="Content cards use a hairline border and no shadow; chrome uses shadow and no visible edge" -->
<!DOCTYPE html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css">
<style>body{padding:16px 20px;background:var(--sf-background);font-family:var(--sf-font-sans)}.g{display:grid;grid-template-columns:repeat(3,1fr);gap:16px}.cap{margin-top:8px;font:400 10px/1.45 var(--sf-font-sans);color:var(--sf-text-muted)}.box{height:86px;display:grid;place-items:center;font:600 12px/1 var(--sf-font-sans);color:var(--sf-text-body)}</style></head><body><div class="g">
<div><div class="box" style="border-radius:20px;background:var(--sf-surface-card);border:1px solid var(--sf-border-hairline)">content card</div><div class="cap">surface 60% · 1px onSurface 6% · no shadow<br>Article, settings, bookmark rows</div></div>
<div><div class="box" style="border-radius:32px;background:var(--sf-surface-chrome);border:1px solid rgb(255 255 255/.15);box-shadow:var(--sf-shadow-16)">chrome</div><div class="cap">surface 98% · white 15% hairline · shadow-16<br>Nav bar, mini player, radio card</div></div>
<div><div class="box" style="border-radius:24px;background:var(--sf-gradient-thumb-fallback);color:#fff;box-shadow:var(--sf-shadow-8)">media hero</div><div class="cap">full-bleed image · bottom scrim · shadow-8<br>Trending cards, collection tiles</div></div>
</div></body></html>
