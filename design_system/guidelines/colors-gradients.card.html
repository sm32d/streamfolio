<!-- @dsCard group="Colors" viewport="700x180" name="Gradients" subtitle="Four gradients, each with exactly one job" -->
<!DOCTYPE html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css">
<style>body{padding:16px 20px;background:var(--sf-background);font-family:var(--sf-font-sans)}.g{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}.b{height:88px;border-radius:16px;display:grid;place-items:end start;padding:10px}.b span{font:var(--sf-weight-bold) 11px/1.35 var(--sf-font-sans);color:#fff}.cap{margin-top:6px;font:var(--sf-weight-regular) 10px/1.4 var(--sf-font-sans);color:var(--sf-text-muted)}</style></head><body><div class="g">
<div><div class="b" style="background:var(--sf-gradient-icon)"><span>icon</span></div><div class="cap">App icon &amp; brand tiles</div></div>
<div><div class="b" style="background:var(--sf-gradient-thumb-fallback)"><span>thumb-fallback</span></div><div class="cap">Missing article image</div></div>
<div><div class="b" style="background:var(--sf-gradient-ai)"><span>ai</span></div><div class="cap">On-device AI spotlight only</div></div>
<div><div class="b" style="background:var(--sf-gradient-page);border:1px solid var(--sf-border-hairline)"><span style="color:var(--sf-text-strong)">page</span></div><div class="cap">Every screen background</div></div>
</div></body></html>
