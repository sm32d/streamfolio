<!DOCTYPE html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css">
<style>body{padding:16px 20px;background:var(--sf-background);font-family:var(--sf-font-sans)}.rows{display:flex;flex-direction:column;gap:5px}.r{display:flex;align-items:center;gap:12px}.r b{font:var(--sf-weight-semibold) 11px/1 var(--sf-font-sans);color:var(--sf-text-muted);width:42px;text-align:right;font-variant-numeric:tabular-nums}.r span{font:var(--sf-weight-medium) 13px/1 var(--sf-font-sans)}.r i{flex:1;height:1px}</style></head><body><div class="rows">
<div class="r"><b>100%</b><span style="color:rgb(6 13 30/1)">Titles, values, primary copy</span></div>
<div class="r"><b>85%</b><span style="color:rgb(6 13 30/.85)">Pill labels, summary body</span></div>
<div class="r"><b>60%</b><span style="color:rgb(6 13 30/.6)">Descriptions, secondary copy</span></div>
<div class="r"><b>50%</b><span style="color:rgb(6 13 30/.5)">Subtitles, dates, header meta</span></div>
<div class="r"><b>45%</b><span style="color:rgb(6 13 30/.45)">Uppercase section labels</span></div>
<div class="r"><b>40%</b><span style="color:rgb(6 13 30/.4)">Timestamps, inactive icons</span></div>
<div class="r"><b>30%</b><span style="color:rgb(6 13 30/.3)">Chevrons, disabled glyphs</span></div>
<div class="r"><b>12%</b><i style="background:rgb(6 13 30/.12)"></i></div>
<div class="r"><b>6%</b><i style="background:rgb(6 13 30/.06)"></i></div>
</div></body></html>
